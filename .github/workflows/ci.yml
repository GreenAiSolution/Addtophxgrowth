name: CI

# The 268 tests in this repo are not decoration. Several of them are the only
# thing standing between the catalogue and selling a client something PHX/GROWTH
# already does for them — the additive rules read the parent's own published
# copy and fail the build on overlap. A guardrail that only runs when someone
# remembers to run it is not a guardrail.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma Client is imported at type-check time, so it has to exist even
      # though nothing here touches a database.
      - run: pnpm prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec next lint

      - name: Test
        run: pnpm exec vitest run

      # Builds with no secrets at all, on purpose: every accessor in env.ts is
      # lazy so a missing key fails the feature that needs it, not the deploy.
      # If this step ever needs a secret, that invariant has been broken.
      - name: Build
        run: pnpm exec next build
